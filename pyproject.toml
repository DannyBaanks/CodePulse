[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codepulse"
version = "0.1.0"
description = "Deterministic code health scorecard with optional AI prioritization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["tomli>=2.0; python_version < '3.11'"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
ai = ["openai>=1.0"]
dev = ["mypy>=1.13", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[project.scripts]
codepulse = "codepulse.cli:main"
codepulse-install-hook = "codepulse.cli:install_hook_entrypoint"

[tool.setuptools.packages.find]
include = ["codepulse*"]
